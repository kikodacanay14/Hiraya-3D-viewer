name: Deploy Hiraya viewer

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out viewer files
        uses: actions/checkout@v4

      - name: Download approved Hiraya model
        run: >-
          curl --location --fail --retry 3
          --output Hiraya.glb
          https://github.com/kikodacanay14/Hiraya-3D-viewer/releases/download/v1.1/Hiraya.glb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
